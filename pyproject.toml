[project]
name = "japanese-vocabulary-audio-dakanji"
version = "0.1.0"
description = "Japanese vocabulary pronunciation audio from WaniKani for DaKanji"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dalang-dict-utils",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.sources]
dalang-dict-utils = { git = "https://github.com/dariyooo/dalang-dict-utils", tag = "v0.3.3" }

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored third-party code stays as it was copied
extend-exclude = ["vendored_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["build.py", "japanese_vocabulary_audio", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
